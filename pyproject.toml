[project]
name = "accessops"
version = "0.1.0"
description = "Access granting, auditing and revocation with AI-assisted ticket triage"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "ansible-core>=2.19",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Timezone database for Europe/Madrid, also in slim containers.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests need Docker; run them with: pytest -m integration
addopts = "-m 'not integration'"
filterwarnings = [
    # Starlette's TestClient nags about a future httpx package; nothing to do on our side.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "integration: needs the running docker compose stack (Postgres, RabbitMQ)",
]
