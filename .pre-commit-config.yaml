# Runs before every commit. Install once: pre-commit install
# Run on everything by hand: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans only the staged changes; a found secret blocks the commit.
      - id: gitleaks
