- name: Read all accounts
  ansible.builtin.getent:
    database: passwd

# managed: accounts with the AccessOps marker; foreign: other human accounts
# (uid >= 1000, except nobody). Foreign accounts are only reported, never changed.
- name: Report managed users
  ansible.builtin.debug:
    msg: >-
      {% set ns = namespace(managed=[], foreign=[]) %}
      {% for name, fields in getent_passwd.items() %}
      {% if fields[3].startswith(marker) %}
      {% set ns.managed = ns.managed + [[name, fields[3] | regex_replace('^.*role=', '')]] %}
      {% elif fields[1] | int >= 1000 and fields[1] | int != 65534 %}
      {% set ns.foreign = ns.foreign + [name] %}
      {% endif %}
      {% endfor %}
      {{ {'managed': ns.managed, 'foreign': ns.foreign} | to_json }}
