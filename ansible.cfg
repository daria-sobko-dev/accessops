# Ansible settings for AccessOps. Paths are relative to the project root:
# run ansible commands from the project root.
[defaults]
inventory = ansible/inventory.ini
interpreter_python = /usr/bin/python3
retry_files_enabled = False
host_key_checking = True
nocows = True
callback_plugins = ansible/callback_plugins

[ssh_connection]
# Trust the test server's host key on first use, reject it if it ever changes.
ssh_args = -o UserKnownHostsFile=.credentials/known_hosts -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o ConnectTimeout=10
